name: Deploy to GitHub Pages

on:
  # Запуск при push в main ветку
  push:
    branches: [ main ]
  # Возможность ручного запуска из вкладки Actions
  workflow_dispatch:

# Разрешения для GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Только один деплой одновременно
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Сборка
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Configure base path for GitHub Pages
        run: |
          # Добавляем base path для корректной работы на GitHub Pages
          REPO_NAME="${{ github.event.repository.name }}"
          sed -i "s|plugins: \[react(), tailwindcss()\],|plugins: [react(), tailwindcss()],\n  base: '/${REPO_NAME}/',|" vite.config.js
          echo "✅ Base path установлен: /${REPO_NAME}/"

      - name: 🏗️ Build project
        run: npm run build

      - name: 📄 Create 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Деплой
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
